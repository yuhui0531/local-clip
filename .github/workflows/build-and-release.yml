name: Build and Package macOS App

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-package:
    name: Build & Package LocalClip
    runs-on: macos-15
    outputs:
      version: ${{ steps.package.outputs.version }}
      build: ${{ steps.package.outputs.build }}
      full_version: ${{ steps.package.outputs.full_version }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4; verified 2026-10-14
        with:
          # 发布说明需要上一个版本 tag 之后的提交记录。
          fetch-depth: 0

      - name: Setup Xcode & Swift Environment
        run: |
          echo "==> 系统环境检查:"
          sw_vers
          uname -m
          xcodebuild -version
          swift --version

      # 发布前必须通过全部自动化测试；任一失败即终止，后续构建与发布都不会执行。
      - name: Run Tests
        timeout-minutes: 30
        # 3核 runner 上并行执行会让主线程调度延迟数百毫秒，触发粘贴焦点等产品级安全期限；
        # CI 串行执行以获得确定结果（本地串行约35秒）。
        run: |
          bash macos-app/scripts/test.sh --no-parallel

      - name: Run Dedicated Pasteboard Protocols
        timeout-minutes: 20
        env:
          LOCALCLIP_NAMED_TEST: '1'
        run: bash macos-app/scripts/test.sh --no-parallel --filter 'NamedPasteboardTests|ReviewAsyncPasteboardTests|ImagePreservationTests|ClipFileExportTests'

      - name: Upload Test Evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4; verified 2026-10-14
        with:
          name: swift-test-log
          path: |
            macos-app/evidence/automated/**/swift-test.log
            macos-app/evidence/automated/**/summary.json
            macos-app/evidence/automated/**/environment.txt
          if-no-files-found: ignore
          retention-days: 14

      - name: Build macOS Application (Release)
        run: |
          bash macos-app/scripts/build-app.sh release

      - name: Package Installer (DMG & ZIP)
        id: package
        run: |
          bash macos-app/scripts/package-dmg.sh
          # 读取版本号输出至 Step Output
          VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" macos-app/Resources/Info.plist 2>/dev/null || echo "1.0.0")
          BUILD=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" macos-app/Resources/Info.plist 2>/dev/null || echo "1")
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "build=${BUILD}" >> "$GITHUB_OUTPUT"
          echo "full_version=v${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Upload Artifacts to GitHub Actions
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4; verified 2026-10-14
        with:
          name: LocalClip-${{ steps.package.outputs.full_version }}-Installer
          path: |
            macos-app/dist/*.dmg
            macos-app/dist/*.zip
            macos-app/dist/checksums.txt
          if-no-files-found: error
          retention-days: 30

  # 验证/打包没有写权限；仅满足tag条件且原生验收有记录的发布job获得写权限，by AI.Coding。
  release:
    needs: build-and-package
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4; verified 2026-10-14
        with:
          fetch-depth: 0
      - name: Require Recorded Native Acceptance
        env:
          LOCALCLIP_NATIVE_ACCEPTANCE: ${{ vars.LOCALCLIP_NATIVE_ACCEPTANCE }}
        run: python3 macos-app/scripts/check-native-acceptance.py
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4; verified 2026-10-14
        with:
          name: LocalClip-${{ needs.build-and-package.outputs.full_version }}-Installer
          path: macos-app/dist
      - name: Prepare Signing Tool and Packaged App
        run: |
          cd macos-app/dist
          shasum -a 256 -c checksums.txt
          ditto -x -k "LocalClip-${{ needs.build-and-package.outputs.full_version }}.zip" .
          cd ../..
          swift build --disable-sandbox --package-path macos-app -c release --product LocalClipUpdateTool

      # 更新签名独立于 Apple 证书；没有正确私钥时禁止发布不可验证的更新，by AI.Coding。
      - name: Sign In-App Update Metadata
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          LOCALCLIP_UPDATE_PRIVATE_KEY: ${{ secrets.LOCALCLIP_UPDATE_PRIVATE_KEY }}
        run: bash macos-app/scripts/sign-update.sh

      # 只有推送版本 tag 才发布；main 推送与 PR 只构建和测试，不会覆盖已发布的安装包。
      - name: Publish to GitHub Releases
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ needs.build-and-package.outputs.full_version }}"
          # tag 必须与 Info.plist 版本一致，防止用旧版本号发布新代码。
          if [ "${{ github.ref_name }}" != "$TAG" ]; then
            echo "::error::推送的 tag ${{ github.ref_name }} 与 Info.plist 版本 $TAG 不一致，请先更新版本号"
            exit 1
          fi
          TITLE="LocalClip ${{ needs.build-and-package.outputs.version }} (Build ${{ needs.build-and-package.outputs.build }})"

          # 更新清单取自注释 tag 的正文（git tag -a 时第一行标题之后的内容）；
          # checkout 会把注释 tag 变成轻量 tag，先强制取回原 tag 对象。
          git fetch --force origin "refs/tags/${TAG}:refs/tags/${TAG}"
          NOTES=$(git tag -l --format='%(contents:body)' "$TAG" | sed '/^-----BEGIN PGP/,$d')
          # tag 没写正文时，退回列出上一个版本 tag 以来的提交标题。
          if [ -z "${NOTES//[[:space:]]/}" ]; then
            PREV=$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)
            if [ -n "$PREV" ]; then NOTES=$(git log --no-merges --format='- %s' "${PREV}..HEAD"); else NOTES=$(git log -1 --format='- %s'); fi
          fi

          BODY="## 更新内容

          ${NOTES}

          ## LocalClip macOS 安装包发布

          - **应用版本**: \`${{ needs.build-and-package.outputs.version }}\` (Build \`${{ needs.build-and-package.outputs.build }}\`)
          - **触发分支 / Tag**: \`${{ github.ref_name }}\`
          - **触发提交**: \`${{ github.sha }}\`

          ### 快速安装指引
          1. 下载下方的 \`.dmg\` 磁盘映像文件。
          2. 双击打开 \`.dmg\`，将 \`LocalClip.app\` 拖入 \`Applications\`（应用程序）目录。
          3. 首次启动若提示未签名开发者警告，请在系统「系统设置」→「隐私与安全性」中点击「仍要打开」。

          ### 文件清单
          - \`LocalClip-${TAG}.dmg\`: 标准 macOS 安装包（含 Applications 拖入捷径）
          - \`LocalClip-${TAG}.zip\`: 便携压缩包
          - \`checksums.txt\`: SHA-256 校验值"

          FILES=(
            "macos-app/dist/LocalClip-${TAG}.dmg"
            "macos-app/dist/LocalClip-${TAG}.zip"
            "macos-app/dist/LocalClip.dmg"
            "macos-app/dist/LocalClip.zip"
            "macos-app/dist/checksums.txt"
            "macos-app/dist/update.json"
            "macos-app/dist/update.sig"
          )

          # 同一版本只发布一次：已存在则失败，绝不覆盖已发布的安装包。
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Release $TAG 已存在；同一版本号不能重复发布，请递增版本号后再打 tag"
            exit 1
          fi
          echo "==> 正在创建新 Release: $TAG"
          gh release create "$TAG" "${FILES[@]}" \
            --title "$TITLE" \
            --notes "$BODY" \
            --latest
